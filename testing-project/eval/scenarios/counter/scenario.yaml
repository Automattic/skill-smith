name: counter-block
description: Create an interactive counter block.
skills:
  - wp-interactivity-api

prompt: |
  Create an interactive counter block for WordPress. The block should:
  1. Display a counter value (starting at 5)
  2. Have "Increment" and "Decrement" buttons that change the counter value

acceptance:
  - Has increment and decrement actions that modify the counter state
  - Uses data-wp-on--click on both increment and decrement buttons
  - Uses data-wp-text or equivalent to display the counter value reactively
  - Server-rendered HTML includes the initial counter value (5)

rubrics:
  - wp-interactivity-api-best-practices
