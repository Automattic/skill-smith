name: counter-block
description: Create an interactive counter block.
skills:
  - wp-interactivity-api

prompt: |
  I want to build a small interactive block for WordPress. On the front end it should show a number that starts at 5, plus two buttons labeled "Increment" and "Decrement". Clicking "Increment" should bump the number up by one, and clicking "Decrement" should bring it down by one. The displayed number needs to update right away when a button is clicked.

acceptance:
  - Has increment and decrement actions that modify the counter state
  - Uses data-wp-on--click on both increment and decrement buttons
  - Uses data-wp-text or equivalent to display the counter value reactively
  - Server-rendered HTML includes the initial counter value (5)

rubrics:
  - wp-interactivity-api-best-practices
