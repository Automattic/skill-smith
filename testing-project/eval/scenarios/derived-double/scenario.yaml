name: derived-double
description: Build a counter that displays its doubled value via a derived getter.
skills:
  - wp-interactivity-api

prompt: |
  I want an interactive block for WordPress that shows two numbers side by
  side: a counter and a value that is always exactly double the counter.
  The counter should start at 1, so when the page first loads the block
  should display 1 next to 2.

  Below the numbers there should be an "Increment" button. Each click
  bumps the counter by 1, and the second number must stay in sync — so
  after one click I see 2 and 4, after two clicks 3 and 6, and so on.
  The doubled number is purely a reflection of the counter; there is no
  separate "doubled" value that a user or action can set independently.

acceptance:
  - The counter is the only mutable numeric field in state/context, and the client-side store exposes the doubled value as a derived getter (computed from the counter on read) — not as a separately stored mutable field. Seeding the doubled value alongside the counter in `wp_interactivity_state()` for server-side rendering is acceptable (this is the static-derived-state pattern from the Interactivity API skill); the test is that the client store has only one mutable field plus a `double` getter, and that no action ever writes to `double`.
  - Has a named increment action that mutates only the counter (e.g. `state.counter++` or the context equivalent); it never assigns to the doubled field.
  - Uses `data-wp-on--click` on the increment button wired to the increment action.
  - The doubled value in the directive expression references the derived getter directly (e.g. `state.double`), not an inline arithmetic expression like `state.counter * 2` or a duplicated stored field.
  - Server-rendered HTML includes the initial values (1 for the counter and 2 for the doubled value) so both read correctly before JavaScript hydrates.

rubrics:
  - wp-interactivity-api-best-practices
